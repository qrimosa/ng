<div class="container mt-5" style="max-width: 600px;">
  <h2 class="mb-4 text-center">Customer Registration</h2>
  <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
    @if (error) { <div class="alert alert-danger">{{ error }}</div> }
    <div class="row">
      <div class="col-md-6 mb-3">
        <label class="form-label">Name</label>
        <input type="text" class="form-control" formControlName="name">
      </div>
      <div class="col-md-6 mb-3">
        <label class="form-label">Email</label>
        <input type="email" class="form-control" formControlName="email">
      </div>
      <div class="col-md-6 mb-3">
        <label class="form-label">Password</label>
        <input type="password" class="form-control" formControlName="password">
      </div>
      <div class="col-md-6 mb-3">
        <label class="form-label">Phone</label>
        <input type="text" class="form-control" formControlName="phone">
      </div>
    </div>
    <h4 class="mt-3">Delivery Address</h4>
    <div formGroupName="deliveryAddress" class="row">
      <div class="col-md-8 mb-3">
        <label class="form-label">Street</label>
        <input type="text" class="form-control" formControlName="street">
      </div>
      <div class="col-md-2 mb-3">
        <label class="form-label">Building</label>
        <input type="text" class="form-control" formControlName="buildingNumber">
      </div>
      <div class="col-md-2 mb-3">
        <label class="form-label">Apt</label>
        <input type="text" class="form-control" formControlName="apartmentNumber">
      </div>
      <div class="col-md-6 mb-3">
        <label class="form-label">Postal Code</label>
        <input type="text" class="form-control" formControlName="postalCode">
      </div>
      <div class="col-md-6 mb-4">
        <label class="form-label">City</label>
        <input type="text" class="form-control" formControlName="city">
      </div>
    </div>
    <button type="submit" class="btn btn-primary w-100">Register</button>
  </form>
</div>
