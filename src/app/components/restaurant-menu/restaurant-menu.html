<div class="container my-5">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <a [routerLink]="['/restaurant', id()]" class="btn btn-outline-secondary btn-sm">
      &larr; Back to Restaurant
    </a>
    <h2 class="fw-bold mb-0">Menu</h2>
    <div></div>
  </div>

  <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
    @for (item of menuItems(); track item.id) {
      <div class="col">
        <div class="card h-100 shadow-sm border-0 position-relative">
          <div class="position-absolute top-0 end-0 m-2">
            @if (item.isAvailable) {
              <span class="badge bg-success">Available</span>
            } @else {
              <span class="badge bg-secondary">Unavailable</span>
            }
          </div>

          <img 
            [src]="item.imageUrl" 
            [alt]="item.name" 
            class="card-img-top object-fit-cover"
            style="height: 180px;"
          />

          <div class="card-body d-flex flex-column justify-content-between">
            <div>
              <div class="d-flex justify-content-between align-items-start mb-2">
                <h5 class="card-title fw-bold mb-0">{{ item.name }}</h5>
                <span class="fw-bold text-primary fs-5 ms-2">
                  {{ item.price | currency:'USD' }}
                </span>
              </div>
              <p class="card-text text-muted small mb-3">
                {{ item.description }}
              </p>
            </div>

            <a 
              [routerLink]="['/restaurant', id(), 'menu', 'product', item.id]" 
              class="btn btn-outline-primary w-100"
              [class.disabled]="!item.isAvailable"
            >
              View Details
            </a>
          </div>
        </div>
      </div>
    } @empty {
      <div class="col-12 text-center py-5">
        <p class="text-muted fs-5">No menu items available at the moment.</p>
      </div>
    }
  </div>
</div>
