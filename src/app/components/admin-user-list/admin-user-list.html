<div class="container my-5">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Admin: Users</h2>
    <a routerLink="/admin/users/new" class="btn btn-primary">Create Admin</a>
  </div>
  <table class="table table-striped table-bordered align-middle">
    <thead class="table-dark">
      <tr>
        <th>Name</th>
        <th>Email</th>
        <th>Role</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      @for (user of users; track user.id) {
        <tr>
          <td>{{ user.name }}</td>
          <td>{{ user.email }}</td>
          <td><span class="badge bg-secondary">{{ user.role }}</span></td>
          <td>
            <div class="d-flex gap-2">
              <button class="btn btn-sm btn-warning" (click)="resetPassword(user.id)">Reset Password</button>
              <button class="btn btn-sm btn-danger" [disabled]="user.id === auth.currentUser()?.id" (click)="deleteUser(user.id)">Delete</button>
            </div>
          </td>
        </tr>
      }
    </tbody>
  </table>
</div>
