<div class="container my-5">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="fw-bold">Admin: Restaurants</h2>
    <a routerLink="/admin/restaurants/new" class="btn btn-primary">Add New Restaurant</a>
  </div>

  <div class="table-responsive">
    <table class="table table-striped table-bordered align-middle">
      <thead class="table-dark">
        <tr>
          <th>Name</th>
          <th>Cuisine</th>
          <th>Rating</th>
          <th>Active</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        @for (rest of restaurants(); track rest.id) {
          <tr>
            <td class="fw-bold">{{ rest.name }}</td>
            <td>{{ rest.cuisine }}</td>
            <td>⭐ {{ rest.rating }}</td>
            <td>
              @if (rest.isActive) {
                <span class="badge bg-success">Yes</span>
              } @else {
                <span class="badge bg-secondary">No</span>
              }
            </td>
            <td>
              <div class="d-flex gap-2">
                <a [routerLink]="['/admin/restaurants', rest.id, 'edit']" class="btn btn-sm btn-outline-primary">
                  Edit
                </a>
                <button 
                  class="btn btn-sm btn-outline-danger" 
                  [disabled]="!rest.isActive"
                  (click)="deactivate(rest.id, rest.name)">
                  Deactivate
                </button>
              </div>
            </td>
          </tr>
        } @empty {
          <tr>
            <td colspan="5" class="text-center py-4">No restaurants found.</td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>
