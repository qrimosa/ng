<div class="container mt-5" style="max-width: 600px;">
  <h2 class="mb-4">My Profile ({{ auth.currentUser()?.role }})</h2>
  <form [formGroup]="profileForm" (ngSubmit)="onSubmit()">
    @if (successMsg) { <div class="alert alert-success">{{ successMsg }}</div> }
    @if (errorMsg) { <div class="alert alert-danger">{{ errorMsg }}</div> }
    <div class="mb-3">
      <label class="form-label">Name</label>
      <input type="text" class="form-control" formControlName="name">
    </div>
    <div class="mb-3">
      <label class="form-label">Email</label>
      <input type="email" class="form-control" formControlName="email">
    </div>
    <div class="mb-3">
      <label class="form-label">New Password (leave blank to keep current)</label>
      <input type="password" class="form-control" formControlName="password">
    </div>
    <div class="mb-3">
      <label class="form-label">Phone</label>
      <input type="text" class="form-control" formControlName="phone">
    </div>
    @if (isCustomer) {
      <h4 class="mt-3">Delivery Address</h4>
      <div formGroupName="deliveryAddress" class="row">
        <div class="col-md-8 mb-3">
          <label class="form-label">Street</label>
          <input type="text" class="form-control" formControlName="street">
        </div>
        <div class="col-md-4 mb-3">
          <label class="form-label">Building/Apt</label>
          <div class="d-flex gap-2">
            <input type="text" class="form-control" formControlName="buildingNumber">
            <input type="text" class="form-control" formControlName="apartmentNumber">
          </div>
        </div>
        <div class="col-md-6 mb-3">
          <label class="form-label">Postal Code</label>
          <input type="text" class="form-control" formControlName="postalCode">
        </div>
        <div class="col-md-6 mb-4">
          <label class="form-label">City</label>
          <input type="text" class="form-control" formControlName="city">
        </div>
      </div>
    }
    <button type="submit" class="btn btn-primary w-100">Save Changes</button>
  </form>
</div>
